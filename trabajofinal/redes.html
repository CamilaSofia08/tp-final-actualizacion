    <body>
<main class="container" id="Cuestionario">
    <div style="display: flex; align-items: center; flex-wrap: wrap; flex-direction: column;">
        <div class= "Tarjeta">
        <p class="pregunta">La topología de una red es...</p>
        <br>
        <button class="btn" onclick="validarredes(this, true, 'topo')">A) La forma en que están conectados los dispositos</button>
        <button class="btn" onclick="validarredes(this, false, 'topo')">B) La velocidad de transmisión de datos</button>
          </div>
         

         <div class= "Tarjeta">
        <p class="pregunta">¿Cuánto alcance tienen las Redes LAN?</p>
        <br>
        <button class="btn" onclick="validarredes(this, true, 'alcance')">A) Alcance local</button>
        <button class="btn" onclick="validarredes(this, false, 'alcance')">B) Alcance global</button>
          </div>
         


         <div class= "Tarjeta">
        <p class="pregunta">¿Por qué el medio de cableado es más veloz que el medio inalámbrico?</p>
        <br>
        <button class="btn" onclick="validarredes(this, false, 'cableado')">A)  Porque tiene mayor ancho de banda</button>
        <button class="btn" onclick="validarredes(this, true, 'cableado')">B) Porque tiene menos interferencias</button>
          </div>
         


         <div class= "Tarjeta">
        <p class="pregunta">¿Qué pasa si falla un cable de una red en bus?</p>
        <br>
        <button class="btn" onclick="validarredes(this, false, 'bus')">A) Solo falla el dispositivo conectado a ese cable</button>
        <button class="btn" onclick="validarredes(this, true, 'bus')">B) Toda la red falla</button>
          </div>
         

         <div class= "Tarjeta">
        <p class="pregunta"> ¿Cuál Red es más grande?</p>
        <br>
        <button class="btn" onclick="validarredes(this, false, 'tamaño')">A) Redes MAN</button>
        <button class="btn" onclick="validarredes(this, true, 'tamaño')">B) Redes WAN</button>
          </div>
  </main>
