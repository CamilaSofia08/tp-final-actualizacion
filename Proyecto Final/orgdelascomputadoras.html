<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Org de las computadoras</title> <link rel="stylesheet" href="orgdelascomputadoras.css">
    <link rel="icon" href="https://cdn3.emoji.gg/emojis/74354-cinnamoroll-wow.png" width="64px" height="64px">
</head>

<body>
<main class="container" id="Cuestionario">
    <div style="display: flex; justify-content: center; align-items: flex-start;gap:3vw; flex-wrap: wrap;">
        <div class= "Tarjeta">
        <p class="pregunta1">¿Qué componente se considera el "cerebro" de la computadora?</p>
        <br>
        <button class="btn" onclick="validarOrg(this, false, 'Rapida')">A) Memoria RAM </button>
        <button class="btn" onclick="validarOrg(this, true, 'Rapida')">B) CPU (Procesador)</button>
          </div>
         

        <div class= "Tarjeta">
        <p class="pregunta2">¿Qué es el Hardware?</p>
        <br>
        <button class="btn" onclick="validarOrg(this, true, 'Tangible')">A) La parte tangible del sistema</button>
        <button class="btn" onclick="validarOrg(this, false, 'Tangible')">B) La parte intangible del sistema</button>
          </div>
         

          
        <div class= "Tarjeta">
        <p class="pregunta3">¿Qué son los dispositivos periféricos?</p>
        <br>
        <button class="btn" onclick="validarOrg(this, true, 'Perifericos')">A) Acessorios externos </button>
        <button class="btn" onclick="validarOrg(this, false, 'Perifericos')">B) Componentes internos </button>
          </div>
        

        
        <div class= "Tarjeta">
        <p class="pregunta4">¿Qué es la tarjeta SSD? </p>
        <br>
        <button class="btn" onclick="validarOrg(this, false, 'SSD')">A)Un dispositivo periférico </button>
        <button class="btn" onclick="validarOrg(this, true, 'SSD')">B)Un tipo de almacenamiento de datos </button>
          </div>
         


          
        <div class= "Tarjeta">
        <p class="pregunta5">¿Qué es la memoria ROM?</p>
        <br>
        <button class="btn" onclick="validarOrg(this, false, 'ROM')">A) Una memoria de lectura y escritura</button>
        <button class="btn" onclick="validarOrg(this, true, 'ROM')">B) Una memoria de solo lectura</button>
          </div>
            </main>
            <div style="display: flex; justify-content: center; align-items: center;">
          <div class= "tarjeta-resultados" id="tarjeta">
             <h2> Resultados</h2>
             <p id="correctas"> Respuestas correctas:</p>
             <p id="incorrectas"> Respuestas incorrectas:</p>
             <hr>

          </div>
    </div>

</body>
</html>
