<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arduino</title>    <link rel="stylesheet" href="arduino.css">
    <link rel="icon"  href="https://cdn3.emoji.gg/emojis/863326-mymelodyemojidiscord.gif" width="44px" height="44px">
</head>


<body>
    <main class="container" id="Cuestionario">
    <div style="display: flex; align-items: center; flex-wrap: wrap; flex-direction: column;">
        <div class= "Tarjeta">
        <p class="pregunta">¿Qué función cumple una placa Arduino?</p>
        <br>
        <button class="btn" onclick="validararduino('A')">A) Procesar video en tiempo real</button>
        <button class="btn" onclick="validararduino('correcto')">B) Ejecutar instrucciones y controlar componentes</button>
          </div>
         


         <div class= "Tarjeta">
        <p class="pregunta">¿Qué instrucción de Arduino se utiliza para encender un LED conectado a un pin digital?</p>
        <br>
        <button class="btn" onclick="validararduino('correcto')">A) DigitalWrite(pin,HIGH);</button>
        <button class="btn" onclick="validararduino('B')">B) AnalongRead(pin);</button>
          </div>
         

         <div class= "Tarjeta">
        <p class="pregunta">¿Qué función cumple loop()?</p>
        <br>
        <button class="btn" onclick="validararduino('A')">A) El código se ejecuta una sola vez</button>
        <button class="btn" onclick="validararduino('B')">B) El código se ejecuta en un bucle infinito</button>
          </div>
         


         <div class= "Tarjeta">
        <p class="pregunta">¿Qué significa LOW en Arduino?</p>
        <br>
        <button class="btn" onclick="validararduino('correcto')">A) Representa un nivel lógico bajo</button>
        <button class="btn" onclick="validararduino('B')">B) Representa un nivel lógico alto</button>
          </div>
         



         <div class= "Tarjeta">
        <p class="pregunta">¿Qué es un sensor? </p>
        <br>
        <button class="btn" onclick="validararduino('correcto')">A) Un dispositivo que detecta cambios en el entorno</button>
        <button class="btn" onclick="validararduino('B')">B) La velocidad de transmisión de datos</button>

          </div>
         </main>

    </div>
