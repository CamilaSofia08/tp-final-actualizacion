<head>

</head>


<body>
    <main class="container" id="Cuestionario">
    <div style="display: flex; align-items: center; flex-wrap: wrap; flex-direction: column;">
        <div class= "Tarjeta">
        <p class="pregunta">¿Qué define la lógica de programación?</p>
        <br>
        <button class="btn" onclick="validarlogica('A')">A) La ciencia que estudia cómo funcionan las computadoras</button>
        <button class="btn" onclick="validarlogica('correcto')">B) La ciencia que distingue el razonamiento correcto del incorrecto</button>
          </div>
         

         <div class= "Tarjeta">
        <p class="pregunta">¿Cuál es la función de una proposición en una expresión lógica?</p>
        <br>
        <button class="btn" onclick="validarlogica('correcto')">A) Indicar si una afirmación es verdadera o falsa</button>
        <button class="btn" onclick="validarlogica('B')">B) Realizar operaciones matemáticas con números</button>
          </div>
         


         <div class= "Tarjeta">
        <p class="pregunta">¿Cuál sería el resultado de 1 + 1 en una cuenta Binaria?</p>
        <br>
        <button class="btn" onclick="validarlogica('A')">A) El resultado es 2</button>
        <button class="btn" onclick="validarlogica('correcto')">B) El resultado es 10</button>
          </div>
         


         <div class= "Tarjeta">
        <p class="pregunta">¿Cuál sería el resultado de 0 - 1 en una cuenta Binaria?</p>
        <br>
        <button class="btn" onclick="validarlogica('correcto')">A) El resultado es 1 y llevas 1 </button>
        <button class="btn" onclick="validarlogica('B')">B) El resultado es 0</button>
          </div>
         


         <div class= "Tarjeta">
        <p class="pregunta">¿Qué función cumple la disyunción (O) en una expresión lógica?</p>
        <br>
        <button class="btn" onclick="validarlogica('correcto')">A) Es verdadera si al menos una de las proposiciones es verdadera</button>
        <button class="btn" onclick="validarlogica('B')">B) Es verdadera únicamente cuando ambas proposiciones son falsas</button>

     </div>
     </main>
